name: ci
on:
  push:
  pull_request:
jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        client: [inprocess, loopback]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -r run test -- --run --testTimeout=20000 --hookTimeout=20000
        env:
          PROCFORGE_CLIENT: ${{ matrix.client }}
      - run: pnpm check:deps
      - name: runner replay (M3, no LLM, junit)
        run: node scripts/m3-ci-replay.mjs
      - name: no policy strings in local bundle
        run: |
          ! grep -ri "분해 정책\|멈춤 판단\|argSpec 분류 휴리스틱" packages/local/src || (echo "policy leak in local" && exit 1)
      - name: no policy strings in MCP surface (descriptions/prompts)
        run: |
          ! grep -n "부가세\|llm_rubric\|numeric_match\|json_path_exists\|file_exists\|auto constraint\|휴리스틱" packages/local/src/server.ts || (echo "policy leak in MCP surface" && exit 1)
      - name: no console.log in local src (stderr logger only, cli.ts excepted)
        run: |
          ! grep -rn "console\.log" packages/local/src --exclude=cli.ts || (echo "console.log forbidden, use logger" && exit 1)
