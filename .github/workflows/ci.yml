name: ci
on:
  push:
  pull_request:
# M5.6: 같은 브랜치 연속 푸시는 이전 run 취소 (fail-fast와 함께 최신만 검증).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        client: [inprocess, loopback]
      # 경로별 잡 분리 없음 (전체 스위트 단일 매트릭스).
      fail-fast: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT
      - name: pnpm store cache (M5.6)
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl python-pptx
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -r run test -- --run --testTimeout=20000 --hookTimeout=20000
        env:
          PROCFORGE_CLIENT: ${{ matrix.client }}
      - run: pnpm check:deps
      - name: runner replay (M3, no LLM, junit)
        run: node scripts/m3-ci-replay.mjs
      - name: no policy strings in local bundle
        run: |
          ! grep -ri --exclude='*.test.ts' "분해 정책\|멈춤 판단\|argSpec 분류 휴리스틱" packages/local/src || (echo "policy leak in local" && exit 1)
      - name: no policy strings in MCP surface (descriptions/prompts)
        run: |
          ! grep -n "부가세\|llm_rubric\|numeric_match\|json_path_exists\|file_exists\|auto constraint\|휴리스틱" packages/local/src/server.ts || (echo "policy leak in MCP surface" && exit 1)
      - name: no console.log in local src (stderr logger only, cli.ts excepted)
        run: |
          ! grep -rn --exclude='*.test.ts' "console\.log" packages/local/src --exclude=cli.ts || (echo "console.log forbidden, use logger" && exit 1)
      - name: no direct approval matching outside approvals service (M5.5-4.3-4)
        run: |
          ! grep -rn --include='*.ts' --exclude='*.test.ts' "matchApproval" packages/local/src | grep -v "services/approvals.ts" | grep -q . || (echo "direct matchApproval forbidden, use checkApproval" && exit 1)
          ! grep -rn --include='*.ts' "\<isApproved>(" packages/local/src packages/local/test packages/shared/src packages/core/src || (echo "isApproved removed, use checkApproval" && exit 1)
  remote-mode:
    # M6.1-2: inprocess와 같은 스위트를 remote로 돈다 (파일당 서버 1대,
    # 송신 수집 + 스위트 끝 egress 위반 단언. 병렬은 vitest.config가 4로 제한).
    # 전체 스위트 remote 이식이 끝나면 이 잡이 곧 remote 커버리지다.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT
      - name: pnpm store cache (M5.6)
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl python-pptx
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:deps
      - name: core-server tests
        run: pnpm --filter @procforge/core-server exec vitest run --testTimeout=20000
      - name: full suite in remote mode
        run: pnpm --filter @procforge/local exec vitest run --run --testTimeout=20000 --hookTimeout=20000
        env:
          PROCFORGE_CLIENT: remote
