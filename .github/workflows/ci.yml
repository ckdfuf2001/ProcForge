name: ci
on:
  push:
  pull_request:
# M5.6: 같은 브랜치 연속 푸시는 이전 run 취소 (fail-fast와 함께 최신만 검증).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        client: [inprocess, loopback]
      # 경로별 잡 분리 없음 (전체 스위트 단일 매트릭스).
      fail-fast: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT
      - name: pnpm store cache (M5.6)
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl python-pptx
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -r run test -- --run --testTimeout=20000 --hookTimeout=20000
        env:
          PROCFORGE_CLIENT: ${{ matrix.client }}
      - run: pnpm check:deps
      - name: runner replay (M3, no LLM, junit)
        run: node scripts/m3-ci-replay.mjs
      - name: repo gates (policy/console/approval, M9-gates)
        run: pnpm check:gates
  remote-mode:
    # M6.1-2: inprocess와 같은 스위트를 remote로 돈다 (파일당 서버 1대,
    # 송신 수집 + 스위트 끝 egress 위반 단언. 병렬은 vitest.config가 4로 제한).
    # 전체 스위트 remote 이식이 끝나면 이 잡이 곧 remote 커버리지다.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT
      - name: pnpm store cache (M5.6)
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl python-pptx
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:deps
      - name: core-server tests
        run: pnpm --filter @proof/core-server exec vitest run --testTimeout=20000
      - name: full suite in remote mode
        run: pnpm --filter @proof/local exec vitest run --run --testTimeout=20000 --hookTimeout=20000
        env:
          PROCFORGE_CLIENT: remote
  e2e:
    # M7-5-6: 실제 chromium + 실제 UI dist + 실제 local 서버 (ubuntu 전용).
    # windows는 DEV-GUIDE §6에 따라 API 계약까지만 (build-test/remote-mode에서 커버).
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT
      - name: pnpm store cache (M5.6)
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl python-pptx
      - run: pnpm install --frozen-lockfile
      # M11-ci-browsers: 브라우저 캐시. 키의 버전은 lockfile의
      # @playwright/test와 함께 올린다 (현재 1.64.1).
      - name: playwright browsers cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.64.1
      # M11-ci-browsers2: 설치를 apt와 다운로드로 나눈다.
      # 어느 쪽이 멈추는지 가리기 위해 분리 + 각 시도에 시간 제한.
      - name: playwright system deps (chromium)
        timeout-minutes: 4
        run: pnpm --filter @proof/local exec playwright install-deps chromium
      - name: playwright browsers (chromium)
        timeout-minutes: 9
        env:
          DEBUG: pw:install
        run: |
          for i in 1 2 3; do
            start=$(date +%s)
            if pnpm --filter @proof/local exec timeout 150 playwright install chromium; then
              echo "[pw-install] attempt $i rc=0 $(( $(date +%s) - start ))s"
              exit 0
            else
              rc=$?
              echo "[pw-install] attempt $i rc=$rc $(( $(date +%s) - start ))s"
            fi
            pkill -f "oopDownload|playwright install" 2>/dev/null || true
            rm -rf ~/.cache/ms-playwright/__dirlock
            sleep 10
          done
          exit 1
      - name: build (시나리오는 dist만 import)
        run: pnpm build
      - name: playwright e2e
        run: pnpm --filter @proof/local exec playwright test -c playwright.config.ts
      - name: e2e artifacts (실패 시에만)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: packages/local/test-results
          if-no-files-found: ignore
          retention-days: 7
